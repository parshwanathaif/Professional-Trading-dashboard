name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install (pinned dependencies)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests main.py dashboard dashboard.py
      - name: Tests (offline, synthetic data only)
        run: python -m pytest -p no:cacheprovider
